<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">类型:</label>
        <div class="col-xs-12 col-sm-8">
            <select name="row[type]" class="form-control selectpicker" data-rule="required">
                {foreach name="typeList" item="vo" key="k"}
                <option value="{$k}" {eq name="row.type" value="$k"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">分区编码:</label>
        <div class="col-xs-12 col-sm-8">
            <select name="row[code]" class="form-control selectpicker" data-rule="required">
                {foreach name="codeList" item="vo" key="k"}
                <option value="{$k}" {eq name="row.code" value="$k"}selected{/eq}>{$vo} ({$k})</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">名称(中文):</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[name]" type="text" value="{$row.name|default=''|htmlentities}" data-rule="required" maxlength="64">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">名称多语言:</label>
        <div class="col-xs-12 col-sm-8">
            {foreach name="localeList" item="locLabel" key="locCode"}
            {if condition="$locCode != 'zh-CN'"}
            <div style="margin-bottom:6px;">
                <label class="text-muted" style="font-weight:normal;">{$locLabel} ({$locCode})</label>
                <input type="text" class="form-control" name="row[name_i18n][{$locCode}]" value="{$row.name_i18n_map[$locCode]|default=''|htmlentities}" maxlength="64" placeholder="留空则用中文名称">
            </div>
            {/if}
            {/foreach}
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">绑定方式:</label>
        <div class="col-xs-12 col-sm-8">
            <select name="row[bind_mode]" class="form-control selectpicker">
                {foreach name="bindModeList" item="vo" key="k"}
                <option value="{$k}" {eq name="row.bind_mode" value="$k"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">排序:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[weigh]" type="number" value="{$row.weigh|default='0'}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态:</label>
        <div class="col-xs-12 col-sm-8">
            <select name="row[status]" class="form-control selectpicker">
                {foreach name="statusList" item="vo" key="k"}
                <option value="{$k}" {eq name="row.status" value="$k"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
