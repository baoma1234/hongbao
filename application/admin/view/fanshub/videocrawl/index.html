<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-heading">
        <p class="text-muted" style="margin:8px 0 0;">
            倒序采集：从「起始页」开始，每次采一页再减一（100→99→…→1）。已发送的 <code>vod_id</code> 会去重。
            定时：<code>*/5 * * * * php think videocrawl:run</code>（需勾选「定时自动采」并启用）。
        </p>
    </div>
    <div class="panel-body">
        <div id="toolbar" class="toolbar">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i></a>
            <a href="javascript:;" class="btn btn-success btn-add {:$auth->check('fanshub/videocrawl/add')?'':'hide'}" title="{:__('Add')}"><i class="fa fa-plus"></i> {:__('Add')}</a>
            <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled {:$auth->check('fanshub/videocrawl/edit')?'':'hide'}" title="{:__('Edit')}"><i class="fa fa-pencil"></i> {:__('Edit')}</a>
            <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('fanshub/videocrawl/del')?'':'hide'}" title="{:__('Delete')}"><i class="fa fa-trash"></i> {:__('Delete')}</a>
            <a href="javascript:;" class="btn btn-warning btn-runonce {:$auth->check('fanshub/videocrawl/runonce')?'':'hide'}" title="立刻采集一页"><i class="fa fa-play"></i> 采集一页</a>
            <a href="javascript:;" class="btn btn-info btn-resetpage {:$auth->check('fanshub/videocrawl/resetpage')?'':'hide'}" title="重置倒序进度"><i class="fa fa-undo"></i> 重置进度</a>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>
