<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">任务名:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[name]" type="text" data-rule="required" placeholder="例如 pgxdy 倒序采集">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">采集地址:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[api_url]" type="text" data-rule="required" value="https://www.pgxdy.com/api/json.php">
            <span class="help-block">接口基址，程序会自动拼 <code>?page=N</code>。例：https://www.pgxdy.com/api/json.php</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">发送群:</label>
        <div class="col-xs-12 col-sm-8">
            <select name="row[group_id]" class="form-control selectpicker" data-live-search="true" data-rule="required">
                <option value="">请选择</option>
                {volist name="groups" id="g"}
                <option value="{$g.id}">#{$g.id} {$g.name|htmlentities}</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">发送UID:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[send_user_id]" type="number" min="1" value="11111111">
            <span class="help-block">默认 11111111（深夜欲望），须已在目标群内</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">倒序起始页:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[start_page]" type="number" min="1" value="100">
            <span class="help-block">先采这一页，再 99、98… 直至第 1 页。若大于接口总页数，会自动落到总页数。</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">每页条数上限:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[page_limit]" type="number" min="0" value="0">
            <span class="help-block">0=本页全部发送；可填 5/10 控制速度</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">定时自动采:</label>
        <div class="col-xs-12 col-sm-8">
            <label class="checkbox-inline"><input type="checkbox" name="row[auto_run]" value="1"> 开启（需配合定时：php think videocrawl:run）</label>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态:</label>
        <div class="col-xs-12 col-sm-8">
            <select name="row[status]" class="form-control selectpicker">
                {foreach name="statusList" item="vo"}
                <option value="{$key}" {eq name="key" value="hidden"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
            <span class="help-block">新建默认停用；点「采集一页」可强制执行一次</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[remark]" type="text">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
