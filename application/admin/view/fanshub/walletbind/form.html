<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">用户ID:</label>
    <div class="col-xs-12 col-sm-8">
        <input class="form-control" name="row[user_id]" type="number" value="{$row.user_id|default='0'}" data-rule="required;integer(+)" min="1" placeholder="会员用户ID">
    </div>
</div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">绑定方式:</label>
    <div class="col-xs-12 col-sm-8">
        <select name="row[bind_mode]" id="c-bind_mode" class="form-control selectpicker" data-rule="required">
            {foreach name="bindModeList" item="vo" key="k"}
            <option value="{$k}" {eq name="row.bind_mode" value="$k"}selected{/eq}>{$vo}</option>
            {/foreach}
        </select>
    </div>
</div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">类型编码:</label>
    <div class="col-xs-12 col-sm-8">
        <input class="form-control" name="row[wallet_type]" id="c-wallet_type" type="text" value="{$row.wallet_type|default='BANK'|htmlentities}" data-rule="required" maxlength="64" list="wallet-type-suggest" placeholder="如 BANK / ALIPAY / WECHAT / BS_USDT">
        <datalist id="wallet-type-suggest">
            {foreach name="walletTypeList" item="vo" key="k"}
            <option value="{$k}">{$vo}</option>
            {/foreach}
        </datalist>
        <span class="help-block">银行卡=BANK，支付宝=ALIPAY，微信=WECHAT；数字钱包用通道编码（如 BS_USDT、NOPAY）</span>
    </div>
</div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">收款人姓名:</label>
    <div class="col-xs-12 col-sm-8">
        <input class="form-control" name="row[account_name]" type="text" value="{$row.account_name|default=''|htmlentities}" maxlength="64" placeholder="银行卡/支付宝建议填写">
    </div>
</div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">账号/地址:</label>
    <div class="col-xs-12 col-sm-8">
        <input class="form-control" name="row[account_no]" type="text" value="{$row.account_no|default=''|htmlentities}" data-rule="required" maxlength="255" placeholder="卡号 / 支付宝账号 / 微信号 / 钱包地址">
    </div>
</div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">银行/备注名:</label>
    <div class="col-xs-12 col-sm-8">
        <input class="form-control" name="row[bank_name]" type="text" value="{$row.bank_name|default=''|htmlentities}" maxlength="64" placeholder="开户行名称；支付宝/微信可填「支付宝」「微信」">
    </div>
</div>
<div class="form-group layer-footer">
    <label class="control-label col-xs-12 col-sm-2"></label>
    <div class="col-xs-12 col-sm-8">
        <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
    </div>
</div>
