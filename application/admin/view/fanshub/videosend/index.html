<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <form id="videosend-form" class="form-horizontal" role="form">
            {:token()}
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">托管账号</label>
                <div class="col-xs-12 col-sm-8">
                    <select class="form-control" name="agent_user_id" id="agent_user_id" required>
                        <option value="">请选择</option>
                        {volist name="agents" id="ag"}
                        <option value="{$ag.user_id}">
                            {$ag.label|default='客服'|htmlentities}
                            （UID {$ag.user_id}）
                        </option>
                        {/volist}
                    </select>
                    <span class="help-block">用该托管号身份发送；须已在目标群内或可私聊对方。</span>
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">发送目标</label>
                <div class="col-xs-12 col-sm-8">
                    <label class="radio-inline">
                        <input type="radio" name="conversation_type" value="2" checked> 群聊
                    </label>
                    <label class="radio-inline">
                        <input type="radio" name="conversation_type" value="1"> 私聊
                    </label>
                </div>
            </div>

            <div class="form-group" id="row-group">
                <label class="control-label col-xs-12 col-sm-2">群</label>
                <div class="col-xs-12 col-sm-8">
                    <select class="form-control" name="group_id" id="group_id">
                        <option value="">请选择或下方手填 ID</option>
                        {volist name="groups" id="g"}
                        <option value="{$g.id}">#{$g.id} {$g.name|default=''|htmlentities}</option>
                        {/volist}
                    </select>
                    <input type="number" class="form-control" style="margin-top:8px;" name="group_id_manual" id="group_id_manual" placeholder="手填群 ID（优先于下拉）" min="1">
                </div>
            </div>

            <div class="form-group" id="row-peer" style="display:none;">
                <label class="control-label col-xs-12 col-sm-2">对方用户 ID</label>
                <div class="col-xs-12 col-sm-8">
                    <input type="number" class="form-control" name="to_user_id" id="to_user_id" placeholder="私聊对方 UID" min="1">
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">预览图（可选）</label>
                <div class="col-xs-12 col-sm-8">
                    <div class="input-group">
                        <input type="text" class="form-control" name="preview_urls" id="preview_urls" placeholder="多图逗号分隔，最多 5 张；也可粘贴 URL">
                        <div class="input-group-addon no-border no-padding">
                            <span>
                                <button type="button" id="faupload-preview" class="btn btn-danger faupload"
                                        data-input-id="preview_urls"
                                        data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp"
                                        data-multiple="true"
                                        data-maxcount="5"
                                        data-preview-id="p-preview-imgs">
                                    <i class="fa fa-upload"></i> 多选上传
                                </button>
                            </span>
                            <span>
                                <button type="button" id="fachoose-preview" class="btn btn-primary fachoose"
                                        data-input-id="preview_urls"
                                        data-mimetype="image/*"
                                        data-multiple="true"
                                        data-maxcount="5"
                                        data-preview-id="p-preview-imgs">
                                    <i class="fa fa-list"></i> 浏览图库
                                </button>
                            </span>
                        </div>
                    </div>
                    <ul class="row list-inline faupload-preview" id="p-preview-imgs" style="margin-top:8px;"></ul>
                    <div id="preview-thumbs" class="videosend-thumbs" style="margin-top:8px;"></div>
                    <span class="help-block">客户端先显示预览图（最多 5 张），下方再播视频；点击缩略图可放大浏览。</span>
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">视频地址</label>
                <div class="col-xs-12 col-sm-8">
                    <textarea class="form-control" name="video_url" id="video_url" rows="3" required placeholder="https://.../xxx.m3u8 或 https://.../xxx.mp4"></textarea>
                    <span class="help-block">支持 <code>mp4</code> 与 <code>m3u8</code>（HLS）。建议 HTTPS，便于 H5 播放。</span>
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">封面图（可选）</label>
                <div class="col-xs-12 col-sm-8">
                    <div class="input-group">
                        <input type="text" class="form-control" name="thumb_url" id="thumb_url" placeholder="播放器 poster，可空">
                        <div class="input-group-addon no-border no-padding">
                            <span>
                                <button type="button" class="btn btn-danger faupload" data-input-id="thumb_url"
                                        data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp"
                                        data-multiple="false" data-preview-id="p-thumb">
                                    <i class="fa fa-upload"></i> 上传
                                </button>
                            </span>
                            <span>
                                <button type="button" class="btn btn-primary fachoose" data-input-id="thumb_url"
                                        data-mimetype="image/*" data-multiple="false" data-preview-id="p-thumb">
                                    <i class="fa fa-list"></i> 浏览
                                </button>
                            </span>
                        </div>
                    </div>
                    <ul class="row list-inline faupload-preview" id="p-thumb" style="margin-top:8px;"></ul>
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">文案（可选）</label>
                <div class="col-xs-12 col-sm-8">
                    <textarea class="form-control" name="content" id="content" rows="2" placeholder="显示在视频下方的说明文字" maxlength="500"></textarea>
                </div>
            </div>

            <div class="form-group layer-footer">
                <label class="control-label col-xs-12 col-sm-2"></label>
                <div class="col-xs-12 col-sm-8">
                    <button type="button" class="btn btn-primary btn-embossed" id="btn-send">
                        <i class="fa fa-paper-plane"></i> 发送视频
                    </button>
                    <span id="send-result" class="text-muted" style="margin-left:12px;"></span>
                </div>
            </div>
        </form>
        <div class="alert alert-info" style="margin-top:16px;">
            布局：预览图（上）→ 视频（中）→ 文案（下）。长视频优先用 m3u8。
        </div>
    </div>
</div>
<style>
.videosend-thumbs { display:flex; flex-wrap:wrap; gap:8px; }
.videosend-thumb {
  position:relative; width:88px; height:88px; border:1px solid #e5e5e5; border-radius:6px;
  overflow:hidden; background:#f7f7f7; cursor:zoom-in;
}
.videosend-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.videosend-thumb-del {
  position:absolute; top:2px; right:4px; width:20px; height:20px; line-height:18px; text-align:center;
  background:rgba(0,0,0,.55); color:#fff; border-radius:50%; font-size:14px; text-decoration:none;
}
.videosend-thumb-del:hover { background:#d9534f; color:#fff; }
#p-preview-imgs img { max-width:88px; max-height:88px; cursor:zoom-in; }
</style>
