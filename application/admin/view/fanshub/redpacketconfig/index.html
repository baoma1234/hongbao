<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
            <fieldset>
                <legend>金额与个数</legend>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">最低金额</label>
                    <div class="col-xs-12 col-sm-8">
                        <input type="number" step="0.01" min="0.01" class="form-control" name="row[min_amount]" value="{$config.min_amount|htmlentities}" data-rule="required">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">普通群个数</label>
                    <div class="col-xs-12 col-sm-4">
                        <div class="input-group">
                            <span class="input-group-addon">最少</span>
                            <input type="number" class="form-control" name="row[min_count]" value="{$config.min_count|htmlentities}" min="1">
                            <span class="input-group-addon">最多</span>
                            <input type="number" class="form-control" name="row[max_count]" value="{$config.max_count|htmlentities}" min="1">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">VIP 群个数</label>
                    <div class="col-xs-12 col-sm-4">
                        <div class="input-group">
                            <span class="input-group-addon">最少</span>
                            <input type="number" class="form-control" name="row[vip_min_count]" value="{$config.vip_min_count|htmlentities}" min="1">
                            <span class="input-group-addon">最多</span>
                            <input type="number" class="form-control" name="row[vip_max_count]" value="{$config.vip_max_count|htmlentities}" min="1">
                        </div>
                    </div>
                </div>
            </fieldset>
            <fieldset>
                <legend>抽水 / 返点 / 过期</legend>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">平台抽水比例</label>
                    <div class="col-xs-12 col-sm-4">
                        <input type="number" step="0.0001" min="0" max="1" class="form-control" name="row[platform_fee_rate]" value="{$config.platform_fee_rate|htmlentities}">
                        <span class="help-block">例：0.03 = 3%</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">代理返点（普通）</label>
                    <div class="col-xs-12 col-sm-4">
                        <input type="number" step="0.0001" min="0" max="1" class="form-control" name="row[agent_rebate_rate_default]" value="{$config.agent_rebate_rate_default|htmlentities}">
                        <span class="help-block">例：0.01 = 1%（群主返佣，默认）</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">代理返点（VIP）</label>
                    <div class="col-xs-12 col-sm-4">
                        <input type="number" step="0.0001" min="0" max="1" class="form-control" name="row[agent_rebate_rate_vip]" value="{$config.agent_rebate_rate_vip|htmlentities}">
                        <span class="help-block">例：0.01 = 1%</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">过期秒数（手气/普通）</label>
                    <div class="col-xs-12 col-sm-4">
                        <input type="number" class="form-control" name="row[expire_seconds]" value="{$config.expire_seconds|htmlentities}" min="1">
                        <span class="help-block">未抢完自动退回；默认 60</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">扫雷过期秒数</label>
                    <div class="col-xs-12 col-sm-4">
                        <input type="number" class="form-control" name="row[mine_expire_seconds]" value="{$config.mine_expire_seconds|default='100'|htmlentities}" min="1">
                        <span class="help-block">埋雷红包未抢完自动退回；默认 100</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">平台收款用户 ID</label>
                    <div class="col-xs-12 col-sm-4">
                        <input type="number" class="form-control" name="row[platform_user_id]" value="{$config.platform_user_id|htmlentities}" min="1" data-rule="required">
                        <span class="help-block">须存在 fa_fans_account；手续费入此账户</span>
                    </div>
                </div>
            </fieldset>
            <div class="form-group layer-footer">
                <label class="control-label col-xs-12 col-sm-2"></label>
                <div class="col-xs-12 col-sm-8">
                    <button type="submit" class="btn btn-success btn-embossed">{:__('OK')}</button>
                </div>
            </div>
        </form>
    </div>
</div>
