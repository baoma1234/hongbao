<style>
.im-wrap { display:flex; height:calc(100vh - 180px); min-height:520px; border:1px solid #e5e5e5; background:#fff; border-radius:0 0 4px 4px; overflow:hidden; }
.im-chat-tabs { display:flex; gap:0; border:1px solid #e5e5e5; border-bottom:0; border-radius:4px 4px 0 0; background:#fff; overflow:hidden; }
.im-chat-tabs .im-tab { flex:1; border:0; background:#f7f9fb; color:#5a6a7a; font-weight:700; font-size:13px; padding:11px 12px; cursor:pointer; border-right:1px solid #e5e5e5; }
.im-chat-tabs .im-tab:last-child { border-right:0; }
.im-chat-tabs .im-tab:hover { background:#eef5ff; color:#1a212d; }
.im-chat-tabs .im-tab.active { background:#2f80ed; color:#fff; }
.im-chat-tabs .im-tab .im-tab-count { display:inline-block; min-width:18px; margin-left:6px; padding:0 6px; border-radius:10px; font-size:11px; font-weight:600; background:rgba(0,0,0,.08); }
.im-chat-tabs .im-tab.active .im-tab-count { background:rgba(255,255,255,.22); }
.im-side { width:300px; border-right:1px solid #e5e5e5; display:flex; flex-direction:column; background:#f7f9fb; }
.im-side-hd { padding:10px; border-bottom:1px solid #e5e5e5; background:#fff; }
.im-conv-list { flex:1; overflow:auto; }
.im-conv-item { display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; border-bottom:1px solid #eef2f6; background:transparent; padding:10px 12px; cursor:pointer; }
.im-conv-item:hover { background:#eef5ff; }
.im-conv-item.active { background:#dff0ff; }
.im-conv-avatar { flex:0 0 42px; width:42px; height:42px; border-radius:50%; overflow:hidden; background:#d0d7e2; color:#445; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.im-conv-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
.im-conv-body { flex:1; min-width:0; }
.im-conv-title { font-weight:700; font-size:13px; color:#1a212d; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.im-conv-preview { margin-top:4px; font-size:12px; color:#8a97a8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.im-conv-time { margin-top:2px; font-size:11px; color:#adb5bd; }
.im-main { flex:1; display:flex; flex-direction:column; min-width:0; }
.im-main-hd { padding:12px 14px; border-bottom:1px solid #e5e5e5; font-weight:700; background:#fff; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.im-msgs { flex:1; overflow:auto; padding:14px; background:#f4f6f9; }
.im-empty { color:#8a97a8; text-align:center; padding:40px 12px; }
.im-row { margin-bottom:14px; display:flex; justify-content:flex-start; align-items:flex-end; gap:8px; }
.im-row.me { justify-content:flex-start; flex-direction:row-reverse; }
.im-row.system { justify-content:center; }
.im-sys { background:transparent; border:0; color:#8a97a8; font-size:12px; padding:4px 10px; }
.im-avatar { flex:0 0 36px; width:36px; height:36px; border-radius:50%; background:#d0d7e2; color:#445; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.im-row.me .im-avatar { background:#2f80ed; color:#fff; }
.im-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
.im-col { max-width:min(72%, 520px); display:flex; flex-direction:column; align-items:flex-start; min-width:0; }
.im-row.me .im-col { align-items:flex-end; }
.im-name { font-size:11px; color:#8a97a8; margin:0 2px 4px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.im-bubble { max-width:100%; background:#fff; border:1px solid #e1e8ed; border-radius:10px 10px 10px 4px; padding:8px 10px; font-size:13px; line-height:1.45; word-break:break-word; position:relative; box-shadow:0 1px 2px rgba(16,24,40,.04); }
.im-row.me .im-bubble { background:#2f80ed; color:#fff; border-color:#2f80ed; border-radius:10px 10px 4px 10px; }
.im-bubble.media, .im-bubble.sticker { padding:6px; background:#fff; border-color:#e1e8ed; }
.im-row.me .im-bubble.media, .im-row.me .im-bubble.sticker { background:#fff; color:#333; }
.im-media-img, .im-sticker-img { display:block; max-width:220px; max-height:220px; border-radius:8px; cursor:zoom-in; }
.im-media-video { display:block; max-width:260px; max-height:200px; border-radius:8px; background:#000; }
.im-rp-card { display:block; width:220px; text-align:left; border:0; border-radius:10px; padding:12px 14px; background:linear-gradient(135deg,#ff6b4a,#e23d2d); color:#fff; cursor:default; }
.im-rp-card .rp-title { font-weight:700; font-size:14px; }
.im-rp-card .rp-sub { margin-top:6px; font-size:12px; opacity:.95; }
.im-meta { display:block; margin-top:4px; font-size:11px; opacity:.75; }
.im-ops { margin-top:6px; }
.im-ops .btn { padding:0 6px; font-size:11px; }
.im-row.me .im-ops .btn { color:#e8f1ff; }
.im-deleted .im-bubble { opacity:.55; text-decoration:line-through; }
.im-composer-wrap { border-top:1px solid #e5e5e5; background:#fff; }
.im-tools { padding:8px 10px 0; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.im-tools .btn-tool { border:0; background:#f0f3f7; color:#445; width:34px; height:34px; border-radius:8px; }
.im-tools .btn-tool:hover, .im-tools .btn-tool.active { background:#2f80ed; color:#fff; }
.im-panel { display:none; margin:8px 10px 0; border:1px solid #e5e5e5; border-radius:8px; background:#fafbfc; max-height:220px; overflow:auto; padding:10px; }
.im-panel.open { display:block; }
.im-emoji-grid { display:flex; flex-wrap:wrap; gap:4px; }
.im-emoji-grid button { border:0; background:transparent; font-size:22px; line-height:1.2; padding:4px; border-radius:6px; }
.im-emoji-grid button:hover { background:#e8eef7; }
.im-sticker-grid { display:flex; flex-wrap:wrap; gap:8px; }
.im-sticker-grid button { border:1px solid #e5e5e5; background:#fff; border-radius:8px; padding:4px; width:64px; height:64px; }
.im-sticker-grid button img { width:100%; height:100%; object-fit:contain; }
.im-rp-form { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; }
.im-rp-form .form-group { margin:0; min-width:100px; }
.im-rp-form label { display:block; font-size:12px; color:#8a97a8; margin-bottom:2px; }
.im-composer { padding:10px; display:flex; gap:8px; align-items:flex-end; }
.im-composer textarea { flex:1; min-height:58px; resize:vertical; }
.im-toolbar { margin-bottom:10px; }
.im-panel-all { display:none; }
.im-panel-all.show { display:block; }
.im-panel-chat.show { display:block; }
.im-panel-chat { display:none; }
.im-lightbox { position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,.78); display:flex; align-items:center; justify-content:center; }
.im-lightbox img, .im-lightbox video { max-width:92vw; max-height:88vh; }
.im-lightbox-close { position:absolute; top:16px; right:20px; color:#fff; font-size:28px; background:transparent; border:0; }
.im-toast-stack {
  position: fixed;
  right: 18px;
  top: 64px;
  bottom: auto;
  z-index: 100000;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 380px;
  width: calc(100vw - 36px);
  pointer-events: none;
}
.im-toast {
  pointer-events: auto;
  background: #1a212d;
  color: #fff;
  border-radius: 10px;
  padding: 14px 16px;
  box-shadow: 0 12px 32px rgba(0,0,0,.35);
  cursor: pointer;
  animation: imToastIn .22s ease;
  border-left: 4px solid #e63022;
}
.im-toast:hover { background: #243041; }
.im-toast-title { font-size: 14px; font-weight: 800; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.im-toast-body { font-size: 13px; color: #c9d3e0; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.im-toast-time { margin-top: 6px; font-size: 11px; color: #8a97a8; }
@keyframes imToastIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>

<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="im-toolbar">
            <div class="btn-group">
                <button type="button" class="btn btn-primary" id="btnViewChat"><i class="fa fa-comments"></i> 聊天模式</button>
                <button type="button" class="btn btn-default" id="btnViewAll"><i class="fa fa-list"></i> 全部记录</button>
            </div>
            <a href="fanshub/imagent/add" class="btn btn-success btn-dialog {:$auth->check('fanshub/imagent/add')?'':'hide'}" title="添加托管账号"><i class="fa fa-user-plus"></i> 托管账号</a>
            <button type="button" class="btn btn-info" id="btnNewPrivate"><i class="fa fa-plus"></i> 发起私聊</button>
            <button type="button" class="btn btn-default" id="btnRefreshAll"><i class="fa fa-refresh"></i> 刷新</button>
        </div>

        <div class="im-panel-chat show" id="panelChat">
            <div class="im-chat-tabs" id="convTabs">
                <button type="button" class="im-tab active" data-tab="1">私聊<span class="im-tab-count" id="tabCountPrivate">0</span></button>
                <button type="button" class="im-tab" data-tab="2">群聊<span class="im-tab-count" id="tabCountGroup">0</span></button>
            </div>
            <div class="im-wrap">
                <div class="im-side">
                    <div class="im-side-hd">
                        <input type="text" class="form-control input-sm" id="convSearch" placeholder="搜索会话 / 内容">
                    </div>
                    <div class="im-conv-list" id="convList"><div class="im-empty">加载中…</div></div>
                </div>
                <div class="im-main">
                    <div class="im-main-hd">
                        <span id="roomTitle">请选择左侧会话</span>
                        <label class="checkbox-inline" style="font-weight:normal;margin:0;">
                            <input type="checkbox" id="chkIncludeDeleted"> 显示已删
                        </label>
                    </div>
                    <div class="im-msgs" id="msgBox"><div class="im-empty">选择会话后查看聊天记录</div></div>
                    <div class="im-composer-wrap">
                        <div class="im-tools">
                            <button type="button" class="btn-tool" id="btnEmoji" title="表情">😊</button>
                            <button type="button" class="btn-tool" id="btnSticker" title="表情包">🎨</button>
                            <button type="button" class="btn-tool" id="btnImage" title="图片"><i class="fa fa-image"></i></button>
                            <button type="button" class="btn-tool" id="btnVideo" title="视频"><i class="fa fa-video-camera"></i></button>
                            <button type="button" class="btn-tool" id="btnFile" title="文件"><i class="fa fa-file-o"></i></button>
                            <button type="button" class="btn-tool" id="btnRedpacket" title="红包">🧧</button>
                            <input type="file" id="imImageInput" accept="image/jpeg,image/png,image/gif,image/webp,image/bmp" style="display:none">
                            <input type="file" id="imVideoInput" accept="video/mp4,video/webm,video/quicktime" style="display:none">
                            <input type="file" id="imFileInput" style="display:none">
                        </div>
                        <div class="im-panel" id="panelEmoji"></div>
                        <div class="im-panel" id="panelSticker"><div class="im-empty">加载表情包…</div></div>
                        <div class="im-panel" id="panelRedpacket">
                            <div class="im-rp-form">
                                <div class="form-group">
                                    <label>金额</label>
                                    <input type="number" class="form-control input-sm" id="rpAmount" min="0.01" step="0.01" value="10">
                                </div>
                                <div class="form-group" id="rpCountWrap">
                                    <label>个数</label>
                                    <input type="number" class="form-control input-sm" id="rpCount" min="1" value="5">
                                </div>
                                <div class="form-group">
                                    <label>类型</label>
                                    <select class="form-control input-sm" id="rpType">
                                        <option value="2" selected>手气包</option>
                                        <option value="3">埋雷包</option>
                                        <option value="1">普通均分</option>
                                    </select>
                                </div>
                                <div class="form-group" id="rpMineWrap" style="display:none;">
                                    <label>雷号(0-9)</label>
                                    <input type="number" class="form-control input-sm" id="rpMineDigit" min="0" max="9" value="0">
                                </div>
                                <div class="form-group">
                                    <label>皮肤</label>
                                    <select class="form-control input-sm" id="rpSkin">
                                        <option value="0">默认</option>
                                        {volist name="rpSkins" id="sk"}
                                        <option value="{$sk.id}" data-type="{$sk.packet_type}">{$sk.name|htmlentities}</option>
                                        {/volist}
                                    </select>
                                </div>
                                <div class="form-group" style="min-width:140px;flex:1;">
                                    <label>祝福语</label>
                                    <input type="text" class="form-control input-sm" id="rpBlessing" value="恭喜发财" maxlength="100">
                                </div>
                                <button type="button" class="btn btn-danger btn-sm" id="btnSendRp">发红包</button>
                            </div>
                        </div>
                        <div class="im-composer">
                            <div style="width:160px;">
                                <label style="font-size:12px;color:#8a97a8;margin:0;">以托管账号发送</label>
                                <select class="form-control input-sm" id="agentSelect">
                                    {volist name="agents" id="ag"}
                                    <option value="{$ag.user_id}">{$ag.label|default='账号'} (#{$ag.user_id})</option>
                                    {/volist}
                                </select>
                            </div>
                            <textarea class="form-control" id="msgInput" placeholder="输入消息… 可发文字/表情/图片/视频/红包"></textarea>
                            <button type="button" class="btn btn-primary" id="btnSend" style="height:58px;min-width:88px;">发送</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="im-panel-all" id="panelAll">
            <div id="toolbar" class="toolbar">
                <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('fanshub/imagent/del')?'':'hide'}" title="删除"><i class="fa fa-trash"></i> 删除</a>
                <a href="javascript:;" class="btn btn-warning btn-restore btn-disabled disabled {:$auth->check('fanshub/imagent/restore')?'':'hide'}" title="恢复"><i class="fa fa-undo"></i> 恢复</a>
            </div>
            <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
        </div>
    </div>
</div>
<div class="im-toast-stack" id="imToastStack"></div>
