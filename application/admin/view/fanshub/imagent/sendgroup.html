<form id="send-form" class="form-horizontal" role="form" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">托管账号:</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="agent_user_id" required>
                {volist name="agents" id="ag"}
                <option value="{$ag.user_id}">{$ag.label|default='账号'} (#{$ag.user_id})</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">群ID:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="group_id" type="number" required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">内容:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" name="content" rows="4" required></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed">发送</button>
        </div>
    </div>
</form>
<script>
require(['jquery', 'form'], function ($, Form) {
    Form.api.bindevent($("#send-form"));
});
</script>
