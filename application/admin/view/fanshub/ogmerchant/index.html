<div class="panel panel-default panel-intro">
    <div class="panel-heading">
        <div class="panel-lead"><em>OG视讯 · 商户配置</em> 先填商户凭证与网关，后续再接登录/转账/回调接口。</div>
    </div>
    <div class="panel-body">
        <form id="og-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="{:url('fanshub.ogmerchant/save')}">
            <fieldset>
                <legend>开关</legend>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">启用 OG视讯</label>
                    <div class="col-xs-12 col-sm-8">
                        <label class="radio-inline"><input type="radio" name="og_enabled" value="1" {if !empty($config.og_enabled)}checked{/if}> 开启</label>
                        <label class="radio-inline"><input type="radio" name="og_enabled" value="0" {if empty($config.og_enabled)}checked{/if}> 关闭</label>
                        <span class="help-block">关闭后前台不展示入口、接口拒绝创建会员/进游戏</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">沙箱模式</label>
                    <div class="col-xs-12 col-sm-8">
                        <label class="radio-inline"><input type="radio" name="og_sandbox" value="1" {if !empty($config.og_sandbox)}checked{/if}> 沙箱</label>
                        <label class="radio-inline"><input type="radio" name="og_sandbox" value="0" {if empty($config.og_sandbox)}checked{/if}> 正式</label>
                        <span class="help-block">沙箱走「沙箱网关」地址；正式走「正式网关」</span>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>商户凭证</legend>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">商户号</label>
                    <div class="col-xs-12 col-sm-6">
                        <input type="text" class="form-control" name="og_merchant_code" value="{$config.og_merchant_code|default=''|htmlentities}" placeholder="Merchant / Operator Code" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">代理号</label>
                    <div class="col-xs-12 col-sm-6">
                        <input type="text" class="form-control" name="og_agent_id" value="{$config.og_agent_id|default=''|htmlentities}" placeholder="Agent ID（若无则留空）" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">API Key</label>
                    <div class="col-xs-12 col-sm-6">
                        <input type="text" class="form-control" name="og_api_key" value="{$config.og_api_key|default=''|htmlentities}" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">API Secret</label>
                    <div class="col-xs-12 col-sm-6">
                        <input type="password" class="form-control" name="og_api_secret" value="{$config.og_api_secret|default=''|htmlentities}" autocomplete="new-password">
                        <span class="help-block">保存后明文写入私有配置（与短信 Token 同策略）</span>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>网关与币种</legend>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">正式网关</label>
                    <div class="col-xs-12 col-sm-8">
                        <input type="text" class="form-control" name="og_api_base_url" value="{$config.og_api_base_url|default=''|htmlentities}" placeholder="https://api.example.com">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">沙箱网关</label>
                    <div class="col-xs-12 col-sm-8">
                        <input type="text" class="form-control" name="og_sandbox_base_url" value="{$config.og_sandbox_base_url|default=''|htmlentities}" placeholder="https://sandbox-api.example.com">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">币种</label>
                    <div class="col-xs-12 col-sm-4">
                        <select class="form-control" name="og_currency">
                            <option value="CNY" {eq name="config.og_currency" value="CNY"}selected{/eq}>CNY</option>
                            <option value="USD" {eq name="config.og_currency" value="USD"}selected{/eq}>USD</option>
                            <option value="USDT" {eq name="config.og_currency" value="USDT"}selected{/eq}>USDT</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">语言</label>
                    <div class="col-xs-12 col-sm-4">
                        <select class="form-control" name="og_language">
                            <option value="zh" {eq name="config.og_language" value="zh"}selected{/eq}>zh 中文</option>
                            <option value="en" {eq name="config.og_language" value="en"}selected{/eq}>en English</option>
                            <option value="th" {eq name="config.og_language" value="th"}selected{/eq}>th ไทย</option>
                            <option value="vi" {eq name="config.og_language" value="vi"}selected{/eq}>vi Tiếng Việt</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">超时（秒）</label>
                    <div class="col-xs-12 col-sm-4">
                        <input type="number" min="3" max="120" class="form-control" name="og_timeout" value="{$config.og_timeout|default=15|htmlentities}">
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>回调与返回</legend>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">钱包回调 URL</label>
                    <div class="col-xs-12 col-sm-8">
                        <input type="text" class="form-control" name="og_callback_url" value="{$config.og_callback_url|default=''|htmlentities}" placeholder="{$suggested_callback|htmlentities}">
                        <span class="help-block">建议：<code>{$suggested_callback|htmlentities}</code>（对接接口时实现）</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">游戏返回 URL</label>
                    <div class="col-xs-12 col-sm-8">
                        <input type="text" class="form-control" name="og_return_url" value="{$config.og_return_url|default=''|htmlentities}" placeholder="{$suggested_return|htmlentities}">
                        <span class="help-block">建议：<code>{$suggested_return|htmlentities}</code></span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-12 col-sm-2">备注</label>
                    <div class="col-xs-12 col-sm-8">
                        <textarea class="form-control" name="og_remark" rows="2" placeholder="对接联系人、合同编号等">{$config.og_remark|default=''|htmlentities}</textarea>
                    </div>
                </div>
            </fieldset>

            <div class="form-group layer-footer">
                <label class="control-label col-xs-12 col-sm-2"></label>
                <div class="col-xs-12 col-sm-8">
                    <button type="submit" class="btn btn-primary btn-embossed">保存商户配置</button>
                </div>
            </div>
        </form>
    </div>
</div>
