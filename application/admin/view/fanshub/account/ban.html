<form id="ban-form" class="form-horizontal" role="form" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">会员</label>
        <div class="col-xs-12 col-sm-8">
            <p class="form-control-static">ID {$row.id}
                {if $user}
                / {$user.nickname|default=''|htmlentities}
                {if $user.mobile} / {$user.mobile|htmlentities}{/if}
                {/if}
            </p>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">封禁范围</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                <label>
                    <input type="radio" name="scope" value="self" checked> 单独封禁
                </label>
            </div>
            <div class="radio">
                <label>
                    <input type="radio" name="scope" value="direct"> 封禁下级
                    <span class="text-muted">（本人 + 直属一级，约 {$direct_total} 人）</span>
                </label>
            </div>
            <div class="radio">
                <label>
                    <input type="radio" name="scope" value="all"> 封禁所有下级
                    <span class="text-muted">（本人 + 全部下级，约 {$team_total} 人）</span>
                </label>
            </div>
            <span class="help-block" style="margin:6px 0 0;">
                封禁后立即踢下线且无法再登录。按邀请关系向下处理，不含上级。
                {if $direct_count > 0 || $team_count > 0}
                <br>直属下级 <strong>{$direct_count}</strong> 人；全部下级 <strong>{$team_count}</strong> 人。
                {/if}
            </span>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-3"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-danger btn-embossed">确认封禁</button>
            <button type="reset" class="btn btn-default btn-embossed">取消</button>
        </div>
    </div>
</form>
