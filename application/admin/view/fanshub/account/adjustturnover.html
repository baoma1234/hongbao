<form id="adjustturnover-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">会员:</label>
        <div class="col-xs-12 col-sm-8">
            <p class="form-control-static">ID {$row.id} / {$user.mobile|default='-'|htmlentities}</p>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">当前待打流水:</label>
        <div class="col-xs-12 col-sm-8">
            <p class="form-control-static">{$row.turnover|default='0'}</p>
            <span class="help-block">规则：充值/赠送增加流水；发红包等扣除流水；流水需=0 才可提现（不能低于 0）。</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">调整方向:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="btn-group" data-toggle="buttons" id="turnover-dir-btns">
                <label class="btn btn-success active">
                    <input type="radio" name="turnover_dir" value="inc" autocomplete="off" checked> 增加流水
                </label>
                <label class="btn btn-danger">
                    <input type="radio" name="turnover_dir" value="dec" autocomplete="off"> 减少流水
                </label>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">调整金额:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="turnover_amount" type="number" step="0.01" min="0.01" value="" placeholder="请输入正数金额" required>
            <span class="help-block">只需填正数，上方选择增加或减少。仅改流水，不改红宝余额。</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="remark" type="text" value="人工加减流水">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed">提交</button>
        </div>
    </div>
</form>
