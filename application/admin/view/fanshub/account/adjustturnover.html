<form id="adjustturnover-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">会员:</label>
        <div class="col-xs-12 col-sm-8">
            <p class="form-control-static">ID {$row.id} / {$user.mobile|default='-'|htmlentities}</p>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">当前待打流水:</label>
        <div class="col-xs-12 col-sm-8">
            <p class="form-control-static">{$row.turnover|default='0'}</p>
            <span class="help-block">规则：充值/赠送增加流水；发红包等扣除流水；流水 ≤ 0 才可提现。</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">流水调整:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="turnover_delta" type="number" step="0.01" value="0" placeholder="正数增加待打流水，负数减少" required>
            <span class="help-block">仅改流水，不改红宝余额。例：填 -100 表示减少 100 待打流水。</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="remark" type="text" value="人工加减流水">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed">提交</button>
        </div>
    </div>
</form>
