<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div id="toolbar" class="toolbar">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i></a>
            <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled {:$auth->check('fanshub/account/edit')?'':'hide'}" title="{:__('Edit')}"><i class="fa fa-pencil"></i> {:__('Edit')}</a>
            <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('fanshub/account/del')?'':'hide'}" title="真删除（不可恢复）"><i class="fa fa-trash"></i> 删除</a>
            <a href="javascript:;" class="btn btn-success btn-export {:$auth->check('fanshub/account/export')?'':'hide'}" title="导出Excel"><i class="fa fa-download"></i> 导出Excel</a>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover"
               data-operate-edit="{:$auth->check('fanshub/account/edit')}"
               data-operate-del="false"
               width="100%"></table>
    </div>
</div>
