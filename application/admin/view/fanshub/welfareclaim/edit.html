<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">用户UID:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" type="text" value="{$row.user_id}" disabled>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">日期:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" type="text" value="{$row.quota_date}" disabled>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">已领次数:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[claim_count]" type="number" value="{$row.claim_count}">
            <span class="help-block">独立计数；改小可让用户继续领</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">娱乐次数:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[entertain_count]" type="number" value="{$row.entertain_count}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">后台加减:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[admin_extra]" type="number" value="{$row.admin_extra}">
            <span class="help-block">正数加机会，负数减机会</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">个人免费额度:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[free_limit]" type="number" value="{$row.free_limit}">
            <span class="help-block">0=用全局；设为 15 则此人今日免费基数为 15</span>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
