<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">游戏 Key:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[game_key]" value="{$row.game_key|default=''|htmlentities}" data-rule="required" maxlength="32" placeholder="与详情页一致：saolei / jielong / niuniu / battle">
            <span class="help-block">对应前台 /pages/home/game-detail?game=xxx</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">标题:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[title]" value="{$row.title|default=''|htmlentities}" data-rule="required" maxlength="64">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">头图:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-hero" class="form-control" name="row[hero]" type="text" value="{$row.hero|default=''|htmlentities}" placeholder="可填 home/lobby/detail-02.png 或上传">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-hero" class="btn btn-danger faupload" data-input-id="c-hero" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="false" data-preview-id="p-hero"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                </div>
            </div>
            <ul class="row list-inline faupload-preview" id="p-hero"></ul>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">角标:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[badge]" value="{$row.badge|default=''|htmlentities}" placeholder="hot / 留空" style="width:120px;display:inline-block">
            <input type="text" class="form-control" name="row[badge_text]" value="{$row.badge_text|default=''|htmlentities}" placeholder="角标文案如 热门" style="width:160px;display:inline-block;margin-left:8px">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">游戏简介:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" name="row[intro]" rows="4" placeholder="详情页「游戏简介」">{$row.intro|default=''|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">游戏规则:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" name="row[rules]" rows="8" placeholder="每行一条规则">{$row.rules|default=''|htmlentities}</textarea>
            <span class="help-block">每行一条，对应详情页「游戏规则」列表</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">排序:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" class="form-control" name="row[weigh]" value="{$row.weigh|default=0}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">显示:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', $statusList, (isset($row['status']) ? $row['status'] : 'normal'))}
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
