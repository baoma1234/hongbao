<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">编码:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[code]" value="" data-rule="required" maxlength="32" placeholder="如 general / freebie">
            <span class="help-block">英文标识，唯一；保存后尽量勿改</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">主题名:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[title]" value="" data-rule="required" maxlength="64" placeholder="展示在帖子标签">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">权重:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" class="form-control" name="row[weigh]" value="0">
            <span class="help-block">越大越靠前</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态:</label>
        <div class="col-xs-12 col-sm-8">
            {foreach name="statusList" item="vo" key="k"}
            <label class="radio-inline"><input type="radio" name="row[status]" value="{$k}" {eq name="k" value="normal"}checked{/eq}> {$vo}</label>
            {/foreach}
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
