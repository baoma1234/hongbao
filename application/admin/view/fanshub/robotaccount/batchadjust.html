<form id="batchadjust-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">会员ID:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" name="ids" rows="4" placeholder="逗号分隔，如 12345678,87654321" required>{$ids|default=''}</textarea>
            <span class="help-block">仅对 is_bot=1 的账户生效</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">红宝调整:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="hongbao_delta" type="number" step="0.01" value="0" placeholder="正数增加，负数扣减" required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="remark" type="text" value="机器人批量加余额">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed">提交</button>
        </div>
    </div>
</form>
