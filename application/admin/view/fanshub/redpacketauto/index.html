<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-heading">
        <p class="text-muted" style="margin:8px 0 0;">
            配置后需启用状态，并由定时任务驱动：<code>php think redpacket:auto</code>（建议每分钟）。
            发包/抢包用户须已在目标群内且红宝充足；拼手气/埋雷抢包机器人红宝需 ≥ 整包金额。
            修改 <code>im-server/start_admin.php</code> 后必须重启 IM Admin Bridge（7273）才生效。
        </p>
    </div>
    <div class="panel-body">
        <div id="toolbar" class="toolbar">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i></a>
            <a href="javascript:;" class="btn btn-success btn-add {:$auth->check('fanshub/redpacketauto/add')?'':'hide'}" title="{:__('Add')}"><i class="fa fa-plus"></i> {:__('Add')}</a>
            <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled {:$auth->check('fanshub/redpacketauto/edit')?'':'hide'}" title="{:__('Edit')}"><i class="fa fa-pencil"></i> {:__('Edit')}</a>
            <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('fanshub/redpacketauto/del')?'':'hide'}" title="{:__('Delete')}"><i class="fa fa-trash"></i> {:__('Delete')}</a>
            <a href="javascript:;" class="btn btn-warning btn-runonce {:$auth->check('fanshub/redpacketauto/runonce')?'':'hide'}" title="立即执行选中任务"><i class="fa fa-play"></i> 立即执行</a>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>
