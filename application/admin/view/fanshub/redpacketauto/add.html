<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">任务名:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[name]" type="text" placeholder="如：VIP群自动红包">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">群ID:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[group_id]" type="number" data-rule="required" min="1">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">自动发包:</label>
        <div class="col-xs-12 col-sm-8">
            <label class="checkbox-inline"><input type="checkbox" name="row[auto_send]" value="1" checked> 开启</label>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">发包用户ID:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[send_user_id]" type="number" min="1" placeholder="平台号/机器人UID，须在群内且红宝充足">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">红包类型:</label>
        <div class="col-xs-12 col-sm-8">
            <select name="row[packet_type]" class="form-control selectpicker">
                {foreach name="packetTypeList" item="vo"}
                <option value="{$key}" {eq name="key" value="2"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">金额/个数:</label>
        <div class="col-xs-12 col-sm-4">
            <div class="input-group">
                <span class="input-group-addon">金额</span>
                <input class="form-control" name="row[total_amount]" type="number" step="0.01" min="0.01" value="10">
                <span class="input-group-addon">个数</span>
                <input class="form-control" name="row[total_count]" type="number" min="1" value="5">
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">祝福语:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[blessing]" type="text" value="恭喜发财">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">埋雷数字:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[mine_digit]" type="number" min="0" max="9" value="0">
            <span class="help-block">仅埋雷包有效，0-9</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">发包间隔(秒):</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[interval_sec]" type="number" min="5" value="60">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">每日上限:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[max_per_day]" type="number" min="0" value="100">
            <span class="help-block">每日最多自动发包次数，0=不限</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">自动抢包:</label>
        <div class="col-xs-12 col-sm-8">
            <label class="checkbox-inline"><input type="checkbox" name="row[auto_grab]" value="1" checked> 开启</label>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">抢包用户ID:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[grab_user_ids]" type="text" placeholder="多个用逗号分隔，如 10001,10002">
            <span class="help-block">机器人须已在群内；手气/埋雷需红宝≥整包金额</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">抢包延迟ms:</label>
        <div class="col-xs-12 col-sm-4">
            <div class="input-group">
                <span class="input-group-addon">最小</span>
                <input class="form-control" name="row[grab_delay_min_ms]" type="number" min="0" value="300">
                <span class="input-group-addon">最大</span>
                <input class="form-control" name="row[grab_delay_max_ms]" type="number" min="0" value="1200">
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态:</label>
        <div class="col-xs-12 col-sm-8">
            <select name="row[status]" class="form-control selectpicker">
                {foreach name="statusList" item="vo"}
                <option value="{$key}" {eq name="key" value="hidden"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
            <span class="help-block">新建默认停用，确认参数后再改为启用</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[remark]" type="text">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
