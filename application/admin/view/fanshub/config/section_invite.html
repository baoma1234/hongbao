<div class="form-group"><label class="control-label col-xs-12 col-sm-2">邀请落地页域名:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="invite_base_url" type="text" value="{$config.invite_base_url|default=''|htmlentities}" placeholder="https://example.com"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">邀请码偏移:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="invite_code_offset" type="number" value="{$config.invite_code_offset|default='0'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">分享文案:</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" name="share_text" rows="5">{$config.share_text|default=''|htmlentities}</textarea></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">跑马灯文案:</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" name="marquee_text" rows="5">{$config.marquee_text|default=''|htmlentities}</textarea></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">IP限制:</label><div class="col-xs-12 col-sm-8"><label><input type="checkbox" name="invite_ip_limit_enabled" value="1" {if condition="!empty($config.invite_ip_limit_enabled)"}checked{/if}> 限制同 IP 邀请注册</label></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">每日分享上限:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="share_daily_max" type="number" value="{$config.share_daily_max|default='20'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">分享冷却(秒):</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="share_cooldown_seconds" type="number" value="{$config.share_cooldown_seconds|default='300'}"></div></div>
