<div class="form-group"><label class="control-label col-xs-12 col-sm-2">控盘·虚拟人数基数:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="market_virtual_base" type="number" step="1" value="{$config.market_virtual_base|default='8000'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">每个真实用户增加虚拟人数:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="market_virtual_per_real" type="number" step="1" value="{$config.market_virtual_per_real|default='5'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">每日增长下限:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="market_daily_grow_min" type="number" step="1" value="{$config.market_daily_grow_min|default='90'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">每日增长上限:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="market_daily_grow_max" type="number" step="1" value="{$config.market_daily_grow_max|default='130'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">总股本基数:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="market_total_shares_seed" type="number" step="0.1" value="{$config.market_total_shares_seed|default='177777.6'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">股价基准:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="market_share_price_base" type="number" step="0.01" value="{$config.market_share_price_base|default='5'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">注入系数:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="market_inject_factor" type="number" step="0.01" value="{$config.market_inject_factor|default='1.3'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">股价下限:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="market_share_price_min" type="number" step="0.01" value="{$config.market_share_price_min|default='5'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">股价上限:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="market_share_price_max" type="number" step="0.01" value="{$config.market_share_price_max|default='7'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">大奖池基数:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="jackpot_base" type="number" step="0.01" value="{$config.jackpot_base|default='1000000'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">大奖池上限:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="jackpot_ceiling" type="number" step="0.01" value="{$config.jackpot_ceiling|default='100000000'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">大奖池每日增长下限:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="jackpot_grow_min" type="number" step="0.01" value="{$config.jackpot_grow_min|default='1000'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">大奖池每日增长上限:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="jackpot_grow_max" type="number" step="0.01" value="{$config.jackpot_grow_max|default='20000'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">市场种子资金:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="market_seed_capital" type="number" step="0.01" value="{$config.market_seed_capital|default='888888'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">大奖池自动增长:</label><div class="col-xs-12 col-sm-8"><label><input type="checkbox" name="jackpot_auto_grow" value="1" {if condition="!empty($config.jackpot_auto_grow)"}checked{/if}> 启用</label> <button type="button" class="btn btn-warning btn-xs" id="btn-reset-jackpot">重置大奖池</button></div></div>
