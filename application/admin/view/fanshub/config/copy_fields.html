<div class="panel panel-default" id="h5-copy-panel"><div class="panel-heading"><div class="panel-lead"><em>H5文案</em><span class="text-muted" style="font-size:12px;margin-left:8px;">管理 H5 页面展示文案</span></div></div><div class="panel-body"><div class="form-group"><label class="control-label col-xs-12 col-sm-2">快速筛选:</label><div class="col-xs-12 col-sm-8"><input type="text" class="form-control" id="h5-copy-search" placeholder="按键名、标签或文案筛选"></div></div>{volist name="h5CopyAdminGroups" id="group"}<fieldset class="h5-copy-group" style="margin-bottom:18px;border:1px solid #e5e5e5;padding:12px 16px;border-radius:4px;"><legend class="h5-copy-group-title" style="width:auto;border:none;margin-bottom:10px;font-size:14px;font-weight:bold;cursor:pointer;"><i class="fa fa-chevron-down"></i> {$group.name}</legend><div class="h5-copy-group-body">{volist name="group.items" id="item"}<div class="form-group h5-copy-field" data-search="{$item.key} {$item.label}"><label class="control-label col-xs-12 col-sm-2">{$item.label}:</label><div class="col-xs-12 col-sm-8">{if condition="$item.is_long"}<textarea class="form-control" name="h5_copy[{$item.key}]" rows="3">{$item.value|htmlentities}</textarea>{else /}<input class="form-control" name="h5_copy[{$item.key}]" type="text" value="{$item.value|htmlentities}">{/if}<p class="help-block">键名: {$item.key}</p></div></div>{/volist}</div></fieldset>{/volist}<div class="form-group"><label class="control-label col-xs-12 col-sm-2"></label><div class="col-xs-12 col-sm-8"><button type="button" class="btn btn-warning" id="btn-reset-h5-copy"><i class="fa fa-undo"></i> 恢复默认文案</button></div></div></div></div>
<script>require(['jquery','fast'],function($,Fast){var $panel=$('#h5-copy-panel');$panel.on('click','.h5-copy-group-title',function(){$(this).closest('.h5-copy-group').find('.h5-copy-group-body').first().slideToggle(180);$(this).find('i.fa').toggleClass('fa-chevron-down fa-chevron-right');});$('#h5-copy-search').on('input',function(){var q=($(this).val()||'').toLowerCase().trim();$panel.find('.h5-copy-field').each(function(){var h=($(this).attr('data-search')||'').toLowerCase()+($(this).find('input,textarea').val()||'').toLowerCase();$(this).toggle(!q||h.indexOf(q)>=0);});$panel.find('.h5-copy-group').each(function(){$(this).toggle($(this).find('.h5-copy-field:visible').length>0);});});$('#btn-reset-h5-copy').on('click',function(){Layer.confirm('确定恢复 H5 默认文案？',{icon:3,title:'恢复默认文案'},function(i){Layer.close(i);Fast.api.ajax({url:Fast.api.fixurl('fanshub.config/resetcopy'),type:'POST'},function(){location.reload();return false;});});});});</script>
