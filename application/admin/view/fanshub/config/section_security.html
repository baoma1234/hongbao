<div class="form-group"><label class="control-label col-xs-12 col-sm-2">谷歌验证器登录:</label><div class="col-xs-12 col-sm-8"><label><input type="checkbox" name="google_auth_login_enabled" value="1" {if condition="!empty($config.google_auth_login_enabled)"}checked{/if}> 启用（H5/会员登录验证码可用动态码；详管请到「谷歌验证器」菜单）</label></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">后台谷歌验证登录:</label><div class="col-xs-12 col-sm-8"><label><input type="checkbox" name="admin_google_auth_enabled" value="1" {if condition="!empty($config.admin_google_auth_enabled)"}checked{/if}> 启用（每个管理员独立密钥，登录必须填谷歌动态码）</label><span class="help-block">密钥在「权限管理 → 管理员管理」编辑账号中绑定/重置；首次请先执行 <code>php scripts/patch_admin_google_auth.php</code></span></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">全局谷歌密钥:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="google_auth_secret" type="text" value="{$config.google_auth_secret|default=''}" placeholder="Base32，可留空仅用用户级密钥"><span class="help-block">也可在菜单「福利大厅 → 谷歌验证器」生成密钥并查看当前动态码 / 已绑定用户。</span></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">验证器显示名:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="google_auth_issuer" type="text" value="{$config.google_auth_issuer|default='FansHub'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">API 签名密钥:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="api_sign_secret" type="text" step="1" value="{$config.api_sign_secret|default=''}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">API 签名有效期(秒):</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="api_sign_ttl" type="number" step="1" value="{$config.api_sign_ttl|default='300'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">设备最多账号数:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="device_fp_max_accounts" type="number" step="1" value="{$config.device_fp_max_accounts|default='3'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">主站 UID 外部校验地址:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="main_uid_verify_url" type="text" step="1" value="{$config.main_uid_verify_url|default=''}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">外部校验超时(秒):</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="main_uid_verify_timeout" type="number" step="1" value="{$config.main_uid_verify_timeout|default='5'}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">API 签名校验:</label><div class="col-xs-12 col-sm-8"><label><input type="checkbox" name="api_sign_enabled" value="1" {if condition="!empty($config.api_sign_enabled)"}checked{/if}> 启用 API 签名校验</label></div></div><div class="form-group"><label class="control-label col-xs-12 col-sm-2">设备指纹限制:</label><div class="col-xs-12 col-sm-8"><label><input type="checkbox" name="device_fp_limit_enabled" value="1" {if condition="!empty($config.device_fp_limit_enabled)"}checked{/if}> 启用设备指纹限制</label></div></div><div class="form-group"><label class="control-label col-xs-12 col-sm-2">主站 UID 外部校验:</label><div class="col-xs-12 col-sm-8"><label><input type="checkbox" name="main_uid_verify_enabled" value="1" {if condition="!empty($config.main_uid_verify_enabled)"}checked{/if}> 启用主站 UID 校验</label><input class="form-control" style="margin-top:8px;" id="test-main-uid" placeholder="测试 UID"><button type="button" class="btn btn-default" id="btn-test-uid-verify">测试校验</button></div></div>
