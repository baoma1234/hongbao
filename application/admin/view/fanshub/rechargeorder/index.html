<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div id="toolbar" class="toolbar">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i></a>
            <div class="btn-group" style="margin-left:8px;">
                <a href="javascript:;" class="btn btn-default btn-status-filter active" data-status="">全部</a>
                <a href="javascript:;" class="btn btn-default btn-status-filter" data-status="pending">待支付</a>
                <a href="javascript:;" class="btn btn-default btn-status-filter" data-status="paid">已到账</a>
                <a href="javascript:;" class="btn btn-default btn-status-filter" data-status="failed">失败/未成功</a>
                <a href="javascript:;" class="btn btn-default btn-status-filter" data-status="cancelled">已取消</a>
            </div>
            <span class="text-muted" style="margin-left:10px;">含通道拉起失败等未成功订单，均可在此查看。</span>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>
