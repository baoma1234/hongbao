<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">游戏 Key:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[game_key]" value="{$row.game_key|default=''|htmlentities}" data-rule="required" maxlength="32" placeholder="如 jielong / saolei">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">游戏名:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[title]" value="{$row.title|default=''|htmlentities}" data-rule="required" maxlength="64">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">封面图:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-cover" class="form-control" name="row[cover]" type="text" value="{$row.cover|default=''|htmlentities}" data-rule="required">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-cover" class="btn btn-danger faupload" data-input-id="c-cover" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="false" data-preview-id="p-cover"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                </div>
            </div>
            <ul class="row list-inline faupload-preview" id="p-cover"></ul>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">角标:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[badge]" value="{$row.badge|default=''|htmlentities}" placeholder="hot / new / 留空">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">大厅分类:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_checkboxs('row[cats]', $catList, $row.cats|default='')}
            <span class="help-block">可多选；出现在所选分类下</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">单群匹配:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[group_match]" value="{$row.group_match|default=''|htmlentities}" placeholder="正则，如 扫雷">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">多群合计:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[sum_group_match]" value="{$row.sum_group_match|default=''|htmlentities}" placeholder="正则，如 红宝接龙\s*(20|50|100|500)群">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">敬请期待:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[coming_soon]', ['0'=>'否','1'=>'是'], $row.coming_soon|default='0')}
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">排序:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" class="form-control" name="row[weigh]" value="{$row.weigh|default=0}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">显示:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', $statusList, $row.status|default='normal')}
            <span class="help-block">「暂停显示」前台不展示</span>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
