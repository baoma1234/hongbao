    <div class="form-group merchant-fields merchant-id-fields" {if condition="!$showMerchantSelect"}style="display:none;"{/if}>
        <label class="control-label col-xs-12 col-sm-2">总商户:</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control selectpicker" name="row[merchant_id]" id="channelMerchantId" data-live-search="true">
                <option value="0">— 请选择总商户 —</option>
                {foreach name="activeMerchantList" item="m"}
                <option value="{$m.id}" {if condition="isset($row.merchant_id) && $row.merchant_id == $m.id"}selected{/if}>{$m.name}（{$m.merchant_no}）</option>
                {/foreach}
            </select>
            <span class="help-block">
                万汇通 / BS：先在「支付总商户」维护凭证，再在此选择。
                <a href="javascript:;" onclick="Backend.api.addtabs('fanshub/paymerchant','支付总商户')">打开总商户</a>
            </span>
        </div>
    </div>
    <div class="form-group merchant-fields">
        <label class="control-label col-xs-12 col-sm-2">提交URL:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[submit_url]" type="text" value="{$row.submit_url|default=''|htmlentities}" placeholder="https://平台域名 或完整接口地址">
            <span class="help-block">久远：填平台根地址。wanhuipay / BS 可留空自动用官方地址。</span>
        </div>
    </div>
    <div class="form-group merchant-fields">
        <label class="control-label col-xs-12 col-sm-2">商户号:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[merchant_no]" id="wanhuiMerchantNo" type="text" value="{$row.merchant_no|default=''|htmlentities}" placeholder="merchantId / merchant_no" readonly>
            <span class="help-block wanhuitong-fields" style="display:none;">选总商户后自动带入（只读）。</span>
            <span class="help-block bs-fields" style="display:none;">选 BS 总商户后自动带入（只读）。</span>
        </div>
    </div>
    <div class="form-group merchant-fields md5-key-fields jiuyuan-channel-fields">
        <label class="control-label col-xs-12 col-sm-2">商户密钥:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[merchant_key]" type="text" value="{$row.merchant_key|default=''|htmlentities}" placeholder="MD5密钥（仅久远通道）">
        </div>
    </div>
    <div class="form-group merchant-fields bs-fields" style="display:none;">
        <label class="control-label col-xs-12 col-sm-2">回调汇率:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[callback_exchange_rate]" type="text" value="{$row.callback_exchange_rate|default=''}" placeholder="可选，留空用系统汇率">
        </div>
    </div>
    <div class="form-group merchant-fields bs-fields bs-recharge-only" style="display:none;">
        <label class="control-label col-xs-12 col-sm-2">充值模式:</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[recharge_mode]">
                <option value="cashier" {neq name="row.recharge_mode" value="api"}selected{/neq}>收银台（返回 payUrl）</option>
                <option value="api" {eq name="row.recharge_mode" value="api"}selected{/eq}>接口（返回收款地址）</option>
            </select>
        </div>
    </div>
    <div class="form-group merchant-fields wanhuitong-fields" style="display:none;">
        <label class="control-label col-xs-12 col-sm-2">钱包通道:</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control selectpicker" name="row[pay_channel]" id="wanhuiPayChannel" data-live-search="true">
                {foreach name="walletList" item="label" key="code"}
                <option value="{$code}" {if condition="isset($row.pay_channel) && $row.pay_channel == $code"}selected{/if}>{$label} — {$code}</option>
                {/foreach}
                {foreach name="quickWalletList" item="label" key="code"}
                <option value="{$code}" {if condition="isset($row.pay_channel) && $row.pay_channel == $code"}selected{/if}>{$label} — {$code}</option>
                {/foreach}
            </select>
            <span class="help-block">官方 payment_channel；选后可自动填通道名称。</span>
        </div>
    </div>
    <div class="form-group merchant-fields bs-fields" style="display:none;">
        <label class="control-label col-xs-12 col-sm-2">USDT币种:</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control selectpicker" name="row[pay_channel]" id="bsPayChannel" data-live-search="true">
                {foreach name="bsCoinList" item="label" key="code"}
                <option value="{$code}" {if condition="isset($row.pay_channel) && $row.pay_channel == $code"}selected{/if}>{$label} — {$code}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group merchant-fields md5-key-fields">
        <label class="control-label col-xs-12 col-sm-2">支付类型:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[pay_type]" type="text" value="{$row.pay_type|default=''|htmlentities}" placeholder="可选；久远填 pay_bankcode 如 932">
        </div>
    </div>
    <div class="form-group merchant-fields md5-key-fields jiuyuan-channel-fields">
        <label class="control-label col-xs-12 col-sm-2">支付通道:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[pay_channel_md5]" type="text" value="{$row.pay_channel|default=''|htmlentities}" placeholder="久远填 pay_cid（保存时写入 pay_channel）">
            <span class="help-block">久远通道用此框；万汇通/BS 请用上方下拉。</span>
        </div>
    </div>
    <div class="form-group merchant-fields wanhuitong-fields" style="display:none;">
        <label class="control-label col-xs-12 col-sm-2">代付类型:</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[withdraw_type]">
                <option value="2" {neq name="row.withdraw_type" value="1"}selected{/neq}>2 钱包代付</option>
                <option value="1" {eq name="row.withdraw_type" value="1"}selected{/eq}>1 三方支付</option>
            </select>
        </div>
    </div>
    <div class="form-group merchant-fields wanhuitong-fields" style="display:none;">
        <label class="control-label col-xs-12 col-sm-2">代付反查URL:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" type="text" readonly value="{$row.verify_url|default=''}" placeholder="保存后显示；填到 wanhuipay 商户后台">
            <span class="help-block">wanhuipay：<code>/api/pay/withdrawverify?channel_id=xx</code></span>
        </div>
    </div>
    <div class="form-group merchant-fields bs-fields" style="display:none;">
        <label class="control-label col-xs-12 col-sm-2">代付反查URL:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" type="text" readonly value="{$row.verify_url|default=''}" placeholder="保存后显示；填到 BS 商户后台">
            <span class="help-block">BS：<code>/api/pay/withdrawverify?channel_id=xx</code>，回调 IP：8.217.236.95</span>
        </div>
    </div>
    <div class="form-group merchant-fields">
        <label class="control-label col-xs-12 col-sm-2">服务器通知URL:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[notify_url]" type="text" value="{$row.notify_url|default=''|htmlentities}" placeholder="留空则保存后自动生成">
            <span class="help-block bs-fields" style="display:none;">回调 IP 白名单：8.217.236.95</span>
        </div>
    </div>
    <div class="form-group merchant-fields">
        <label class="control-label col-xs-12 col-sm-2">页面跳转URL:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[return_url]" type="text" value="{$row.return_url|default=''|htmlentities}" placeholder="留空默认 /888/#profile">
        </div>
    </div>
    <div class="form-group merchant-fields">
        <label class="control-label col-xs-12 col-sm-2">商品名称:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[product_name]" type="text" value="{$row.product_name|default=''|htmlentities}" placeholder="账户充值 / 账户提现">
        </div>
    </div>
