<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {if condition="$fixedType"}
    <input type="hidden" name="row[type]" value="{$fixedType}">
    {else /}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">类型:</label>
        <div class="col-xs-12 col-sm-8">
            <select name="row[type]" class="form-control selectpicker">
                {foreach name="typeList" item="vo"}
                <option value="{$key}">{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    {/if}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">名称:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[name]" type="text" data-rule="required">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">所属分区:</label>
        <div class="col-xs-12 col-sm-8">
            <select name="row[partition_id]" class="form-control selectpicker">
                {foreach name="partitionList" item="vo" key="k"}
                <option value="{$k}">{$vo}</option>
                {/foreach}
            </select>
            <span class="help-block">前台按分区分组展示；可在「财务管理 → 充提分区」编辑分区名称/多语言</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">图标URL:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[icon]" type="text" placeholder="可选">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">前台提示:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[tip]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">对接处理器:</label>
        <div class="col-xs-12 col-sm-8">
            <select name="row[handler]" class="form-control selectpicker">
                {foreach name="handlerList" item="vo"}
                <option value="{$key}">{$vo}</option>
                {/foreach}
            </select>
            <span class="help-block">manual=人工；url=外链；cs=客服；merchant=MD5测试；jiuyuan=久远；wanhuitong=万汇通RSA2</span>
        </div>
    </div>
    {include file="fanshub/paychannel/merchant_fields" /}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">扩展配置JSON:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" rows="5" name="row[config]" placeholder="{&quot;url&quot;:&quot;https://...&quot;,&quot;message&quot;:&quot;提示语&quot;}"></textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">最小金额:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[min_amount]" type="number" step="0.01" value="0">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">最大金额:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[max_amount]" type="number" step="0.01" value="0">
            <span class="help-block">0 表示不限制</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">快捷金额:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[quick_amounts]" type="text" value="" placeholder="50,100,500,1000,5000,10000,50000,100000">
            <span class="help-block">充值页快捷档位，各通道可不同；逗号分隔，最多16个；留空则用前台默认档</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">排序:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[weigh]" type="number" value="0">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">前台显示:</label>
        <div class="col-xs-12 col-sm-8">
            <select name="row[status]" class="form-control selectpicker">
                {foreach name="statusList" item="vo"}
                <option value="{$key}" {eq name="key" value="normal"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
