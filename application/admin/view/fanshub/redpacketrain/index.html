<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-heading">
        <p class="text-muted" style="margin:8px 0 0;">
            到设定的分钟开启一轮：先发 1 个红宝，抢完再发下一个，直到该时段配置的次数发完。每个机器人本轮有抢包上限；超过设定分钟后，机器人把当前未领完的包领完。
            由聊天定时进程驱动，改机器人代码后需<strong>重启聊天服务</strong>。
        </p>
    </div>
    <div class="panel-body">
        <div id="toolbar" class="toolbar">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i></a>
            <a href="javascript:;" class="btn btn-success btn-add {:$auth->check('fanshub/redpacketrain/add')?'':'hide'}" title="{:__('Add')}"><i class="fa fa-plus"></i> {:__('Add')}</a>
            <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled {:$auth->check('fanshub/redpacketrain/edit')?'':'hide'}" title="{:__('Edit')}"><i class="fa fa-pencil"></i> {:__('Edit')}</a>
            <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('fanshub/redpacketrain/del')?'':'hide'}" title="{:__('Delete')}"><i class="fa fa-trash"></i> {:__('Delete')}</a>
            <a href="javascript:;" class="btn btn-warning btn-runonce {:$auth->check('fanshub/redpacketrain/runonce')?'':'hide'}" title="立即发一轮"><i class="fa fa-play"></i> 立即发一轮</a>
            <a href="javascript:;" class="btn btn-danger btn-restartim {:$auth->check('fanshub/redpacketauto/restartim')?'':'hide'}" title="重启聊天服务 IM"><i class="fa fa-power-off"></i> 重启聊天服务</a>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>
