<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div id="toolbar" class="toolbar">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i></a>
            <a href="javascript:;" class="btn btn-success btn-add {:$auth->check('fanshub/imgroup/add')?'':'hide'}" title="创建群组"><i class="fa fa-plus"></i> 创建群组</a>
            <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('fanshub/imgroup/del')?'':'hide'}" title="解散"><i class="fa fa-trash"></i> 解散</a>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
               data-operate-edit="{:$auth->check('fanshub/imgroup/edit')}"
               data-operate-del="{:$auth->check('fanshub/imgroup/del')}"
               width="100%"></table>
    </div>
</div>
