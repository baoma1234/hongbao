<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div id="toolbar" class="toolbar">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i></a>
            <a href="javascript:;" class="btn btn-success btn-add {:$auth->check('fanshub/imgroup/add')?'':'hide'}" title="创建群组"><i class="fa fa-plus"></i> 创建群组</a>
            <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('fanshub/imgroup/del')?'':'hide'}" title="解散"><i class="fa fa-trash"></i> 解散</a>
            <a href="javascript:;" class="btn btn-danger btn-harddel btn-disabled disabled {:$auth->check('fanshub/imgroup/harddel')?'':'hide'}" title="硬删除（不可恢复）" style="background:#8B0000;border-color:#700;"><i class="fa fa-times-circle"></i> 硬删除</a>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover"
               data-operate-edit="{:$auth->check('fanshub/imgroup/edit')}"
               data-operate-del="{:$auth->check('fanshub/imgroup/del')}"
               width="100%"></table>
    </div>
</div>
<style>
#table td.imgroup-admin-cell {
    max-width: 180px;
    white-space: normal !important;
    word-break: break-word;
    line-height: 1.35;
    vertical-align: middle;
}
#table .imgroup-admin-brief {
    display: inline-block;
    max-width: 160px;
    cursor: help;
}
#table .imgroup-avatar-thumb {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    object-fit: cover;
    background: #f0f0f0;
}
</style>
