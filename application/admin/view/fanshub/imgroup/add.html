<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">群名称:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[name]" value="" data-rule="required" placeholder="如：福利群1">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">群主会员ID:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" class="form-control" name="row[owner_user_id]" value="" data-rule="required" placeholder="fa_user.id">
            <span class="help-block">可填 IM 托管账号的会员ID</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">群管理员ID:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[admin_user_ids]" value="" placeholder="多个用逗号分隔">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">普通成员ID:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[member_user_ids]" value="" placeholder="可选，多个用逗号分隔">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">群公告:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" name="row[notice]" rows="3"></textarea>
        </div>
    </div>
    {if $agents}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">快捷托管账号:</label>
        <div class="col-xs-12 col-sm-8">
            <ul class="list-unstyled" style="margin:0;">
                {foreach name="agents" item="a"}
                <li>ID {$a.user_id} · {$a.label|default='客服'}</li>
                {/foreach}
            </ul>
        </div>
    </div>
    {/if}
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
