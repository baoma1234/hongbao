<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">分类 Key:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[cat_key]" value="{$row.cat_key|default=''|htmlentities}" data-rule="required" maxlength="32" placeholder="如 hot / games / notice">
            <span class="help-block">英文唯一标识，游戏归属时用</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">分类名:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[title]" value="{$row.title|default=''|htmlentities}" data-rule="required" maxlength="64">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">图标:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-icon" class="form-control" name="row[icon]" type="text" value="{$row.icon|default=''|htmlentities}" placeholder="上传或填 home/lobby/1.png">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-icon" class="btn btn-danger faupload" data-input-id="c-icon" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="false" data-preview-id="p-icon"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                </div>
            </div>
            <ul class="row list-inline faupload-preview" id="p-icon"></ul>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">打包图标:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[icon_static]" value="{$row.icon_static|default=''|htmlentities}" placeholder="可选，如 logo.png（优先于上方图标）">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">点击动作:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[action]', $actionList, $row.action|default='filter')}
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">动作地址:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[action_url]" value="{$row.action_url|default=''|htmlentities}" placeholder="action=url 时填写">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">排序:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" class="form-control" name="row[weigh]" value="{$row.weigh|default=0}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', $statusList, $row.status|default='normal')}
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
