<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">标题</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[title]" value="{$row.title|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">奖金池</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" step="0.01" min="0.01" class="form-control" name="row[pool_amount]" value="{$row.pool_amount}" data-rule="required">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">当前进度</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" min="0" class="form-control" name="row[global_quals]" value="{$row.global_quals}" data-rule="required;integer">
            <span class="help-block">已获得的全局资格数（进度分子）</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">全局上限</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" min="1" class="form-control" name="row[global_cap]" value="{$row.global_cap}" data-rule="required;integer">
            <span class="help-block">满额开奖阈值（进度分母）</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">单人上限</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" min="1" class="form-control" name="row[user_cap]" value="{$row.user_cap}" data-rule="required;integer">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">状态</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[status]" data-rule="required">
                {foreach name="statusList" item="label" key="val"}
                <option value="{$val}" {eq name="row.status" value="$val"}selected{/eq}>{$label}</option>
                {/foreach}
            </select>
            <span class="help-block">改为「进行中」时，不能与其它进行中活动并存；改状态不会自动发奖/结算。</span>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-3"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
