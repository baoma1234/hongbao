<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <form id="start-form" class="form-horizontal" role="form" method="POST">
            {:token()}
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">标题</label>
                <div class="col-xs-12 col-sm-8">
                    <input type="text" class="form-control" name="title" value="全网裂变红宝">
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">奖金池</label>
                <div class="col-xs-12 col-sm-8">
                    <input type="number" step="0.01" class="form-control" name="pool_amount" value="1000">
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">全局资格</label>
                <div class="col-xs-12 col-sm-8">
                    <input type="number" class="form-control" name="global_cap" value="100">
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">单人上限</label>
                <div class="col-xs-12 col-sm-8">
                    <input type="number" class="form-control" name="user_cap" value="5">
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">有效小时</label>
                <div class="col-xs-12 col-sm-8">
                    <input type="number" class="form-control" name="duration_hours" value="72">
                </div>
            </div>
            <div class="form-group">
                <div class="col-xs-12 col-sm-8 col-sm-offset-2">
                    <button type="submit" class="btn btn-success">开启</button>
                </div>
            </div>
        </form>
    </div>
</div>
<script>
require(['jquery', 'backend'], function ($, Backend) {
    $('#start-form').on('submit', function (e) {
        e.preventDefault();
        Fast.api.ajax({
            url: Fast.api.fixurl('fanshub/fission/start'),
            data: $(this).serialize()
        }, function () {
            Fast.api.close();
            return false;
        });
    });
});
</script>
