<form id="progress-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">活动</label>
        <div class="col-xs-12 col-sm-8">
            <p class="form-control-static">#{$row.id} {$row.title|htmlentities}</p>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">全局上限</label>
        <div class="col-xs-12 col-sm-8">
            <p class="form-control-static">{$row.global_cap}</p>
            <span class="help-block">进度不可超过此上限；改上限请用「编辑」。</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">当前进度</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" min="0" class="form-control" name="row[global_quals]" value="{$row.global_quals}" data-rule="required;integer">
            <span class="help-block">已获得的全局资格数（进度分子）</span>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-3"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
