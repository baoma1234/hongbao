<ul class="nav nav-tabs platform-pid-tabs" data-field="pid">
    <li class="{:$Think.get.pid === null ? 'active' : ''}"><a href="#t-all" data-value="" data-toggle="tab">{:__('All')}</a></li>
    {foreach name="pidList" item="vo"}
    <li class="{:$Think.get.pid === (string)$key ? 'active' : ''}"><a href="#t-pid-{$key}" data-value="{$key}" data-toggle="tab">{$vo}</a></li>
    {/foreach}
</ul>
