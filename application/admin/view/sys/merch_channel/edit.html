<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" type="text" value="{$row.id|htmlentities}" readonly>
        </div>
    </div>
    {include file="sys/common/pid_field" /}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('ChannelName')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-channelName" class="form-control" name="row[channelName]" type="text" value="{$row.channelName|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('MerchCode')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-merchCode" data-rule="required" class="form-control" name="row[merchCode]" type="text" value="{$row.merchCode|htmlentities}">
            <span class="help-block">对应订单 merchAgentId，用于匹配推送群组</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Chanel')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-chanel" class="form-control" name="row[chanel]" type="text" value="{$row.chanel|htmlentities}">
            <span class="help-block">Telegram 群组 chat_id，如 -1001234567890</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label>
            {/foreach}
            </div>
            <span class="help-block">停用后该商户不再接收催单通知</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Addtime')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-addtime" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" name="row[addtime]" type="text" value="{$row.addtime|datetime}">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
