# CORS：只保留 PHP（check_cors_request），不要在 Nginx 再加 Allow-Origin
# 否则浏览器报错：Access-Control-Allow-Origin contains multiple values '..., *'
#
# 请删除站点里类似下面的配置（宝塔「跨域」开关也会写入）：
#
#   add_header Access-Control-Allow-Origin *;
#   add_header Access-Control-Allow-Origin *;
#   add_header Access-Control-Allow-Methods *;
#   add_header Access-Control-Allow-Headers *;
#   add_header Access-Control-Allow-Credentials true;
#
# 删完后：
#   nginx -t && nginx -s reload
#
# 正确做法：.env / config 里 cors_request_domain=*（或具体域名列表），由 PHP 反射 Origin。
